ternal check based on the nearest-point metric: a coeval DEB statistic in $(M,L)$ space. These statistics are mapp", "score": 0.226, "status": "candidate", "preprint": true, "cluster": 3, "topics": ["astro-ph.SR", "astro-ph.GA"]}, {"key": "vilar2025chemical", "title": "Chemical Abundances of M and G Dwarfs in the Hyades and Coma Berenices Open Clusters from APOGEE Spectra", "authors": ["Deusalete Vilar", "Diogo Souto", "Katia Cunha", "Anderson andrade-silva", "Veronica Loaiza-Tucuri", "Fabio Wanderley"], "n_authors": 11, "year": 2025, "venue": "arXiv", "cited_by": 0, "doi": "", "url": "https://arxiv.org/abs/2509.11938", "oa_url": "https://arxiv.org/pdf/2509.11938", "abstract": "Open clusters are one of the best astrophysical laboratories we have available for stellar astrophysics studies. This work presents metallicities and individual abundances for fourteen M dwarfs and six G dwarfs from two well-known open clusters: Hyades and Coma Berenices. Our analysis is based on near-infrared (1.51--1.69 $μ$m), high-resolution ($R \\sim 22,500$) spectra obtained from the SDSS IV/APOGEE Survey. Using one-dimensional, plane-parallel MARCS model atmospheres, the APOGEE line list, and the Turbospectrum radiative transfer code in local thermodynamic equilibrium, we derived spectroscopic stellar parameters for the M dwarfs, along with abundances of 13 elements (C, O, Na, Mg, Al, Si, K, Ca, Ti, V, Cr, Mn, and Fe) for both M and G dwarfs. We find a high degree of chemical homogeneity within each cluster when comparing abundances derived from M and G dwarfs: $δ$[M/H] (M dwarfs -- G dwarfs) of 0.01$\\pm$0.04, and 0.02$\\pm$0.03 for the Hyades and Coma Berenices, respectively. The overall cluster metallicities derived from M dwarfs (Hyades: 0.16$\\pm$0.03 and Coma Berenices: 0.02$\\pm$0.06) are consistent with previous literature determinations. Finally, we demonstrate the value ", "score": 0.186, "status": "candidate", "preprint": true, "cluster": 3, "topics": ["astro-ph.SR", "astro-p ": 2021, "venue": "arXiv", "cited_by": 17, "doi": "10.3847/2041-8213/ac2156", "url": "https://doi.org/10.3847/2041-8213/ac2156", "oa_url": "https://arxiv.org/pdf/2109.03837", "abstract": "Abstract Chemical tagging is a powerful tool to reveal the origin of stars and globular clusters (GCs), especially when dynamics alone cannot provide robust answers. So far, mostly α-elements and neutron capture elements have been used to distinguish stars born in the Milky Way (MW) from those born in external environments such as that of dwarf galaxies. Here, instead, we use iron-peak element abundances to investigate the origin of a sample of metal-rich GCs. By homogeneously analyzing high-resolution UVES spectra of giant stars belonging to four metal-rich GCs (namely NGC 5927, NGC 6388, NGC 6441, and NGC 6496), we find that while the α-elements Si and Ca have similar abundance ratios for all four GCs, and Ti and neutron capture elements (La, Ba, and Eu) only show a marginal discrepancy, a stark difference is found when considering the abundances of some iron-peak elements (Sc, V, and Zn). In particular, NGC 6388 and NGC 6441 have abundance ratios for these iron-peak elements significantly lower (by ∼0.5 dex) than those measured in NGC 5927 and NGC 6496, which are clearly identified as born in situ MW clusters through an analysis of their orbital properties. These measurements in", "score": 0.184, "status": "candidate", "preprint": false, "cluster": 2, "topics": ["astro-ph.GA", "astro-ph.SR"]}, {"key": "shipp2018stellar", "title": "Stellar Streams Discovered in the Dark Energy Survey", "authors": ["Nora Shipp", "A. Drlica-Wagner", "E. Balbinot", "P. S. Ferguson", "Denis Erkal", "T. S. Li"], "n_authors": 85, "year": 2018, "venue": "The Astrophysical Journal", "cited_by": 287, "doi": "10.3847/1538-4357/aacdab", "url": "https://doi.org/10.3847/1538-4357/aacdab", "oa_url": "https://iopscience.iop.org/article/10.3847/1538-4357/aacdab/pdf", "abstract": "Abstract We perform a search for stellar streams around the Milky Way using the first 3 yr of multiband optical imaging data from the Dark Energy Survey (DES). We use DES data covering ∼5000 deg2 to a depth of g > 23.5 with a relative photometric calibration uncertainty of <1%. This data set yields unprecedented sensitivity to the stellar density field in the southern celestial hemisphere, enabling the detection of faint stellar streams to a heliocentric distance of ∼50 kpc. We search for stellar streams using a matched filter in color–magnitude space derived from a synthetic isochrone of an old, metal-poor stellar population. Our detection technique recovers four previously known thin stellar streams: Phoenix, ATLAS, Tucana III, and a possible extension of Molonglo. In addition, we report the discovery of 11 new stellar streams. In general, the new streams detected by DES are fainter, more distant, and lower surface brightness than streams detected by similar techniques in previous photometric surveys. As a by-product of our stellar stream search, we find evidence for extratidal stellar structure associated with four globular clusters: NGC 288, NGC 1261, NGC 1851, and NGC 1904. Th", "score": 0.425, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astronomy and Astrophysical Research"]}, {"key": "ji2020southern", "title": "The Southern Stellar Stream Spectroscopic Survey (S5): Chemical Abundances of Seven Stellar Streams", "authors": ["Alexander P. Ji", "Ting S. Li", "Terese T. Hansen", "Andrew R. Casey", "Sergey E. Koposov", "Andrew B. Pace"], "n_authors": 19, "year": 2020, "venue": "The Astronomical Journal", "cited_by": 89, "doi": "10.3847/1538-3881/abacb6", "url": "https://doi.org/10.3847/1538-3881/abacb6", "oa_url": "https://iopscience.iop.org/article/10.3847/1538-3881/abacb6/pdf", "abstract": "Abstract We present high-resolution Magellan/MIKE spectroscopy of 42 red giant stars in seven stellar streams confirmed by the Southern Stellar Stream Spectroscopic Survey (S 5): ATLAS, Aliqa Uma, Chenab, Elqui, Indus, Jhelum, and Phoenix. Abundances of 30 elements have been derived from over 10,000 individual line measurements or upper limits using photometric stellar parameters and a standard LTE analysis. This is currently the most extensive set of element abundances for stars in stellar streams. Three streams (ATLAS, Aliqa Uma, and Phoenix) are disrupted metal-poor globular clusters, although only weak evidence is seen for the light-element anticorrelations commonly observed in globular clusters. Four streams (Chenab, Elqui, Indus, and Jhelum) are disrupted dwarf galaxies, and their stars display abundance signatures that suggest progenitors with stellar masses ranging from 106 to 107 M ⊙. Extensive description is provided for the analysis methods, including the derivation of a new method for including the effect of stellar parameter correlations on each star’s abundance and uncertainty. This paper includes data gathered with the 6.5 m Magellan Telescopes located at Las Campana", "score": 0.377, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astronomy and Astrophysical Research"]}, {"key": "bonaca2024stellar", "title": "Stellar streams in the Gaia era", "authors": ["Ana Bonaca", "Adrian M. Price-Whelan"], "n_authors": 2, "year": 2024, "venue": "New Astronomy Reviews", "cited_by": 80, "doi": "10.1016/j.newar.2024.101713", "url": "https://doi.org/10.1016/j.newar.2024.101713", "oa_url": "https://doi.org/10.1016/j.newar.2024.101713", "abstract": "The hierarchical model of galaxy formation predicts that the Milky Way halo is populated by tidal debris of dwarf galaxies and globular clusters. Due to long dynamical times, debris from the lowest mass objects remains coherent as thin and dynamically cold stellar streams for billions of years. The Gaia mission, providing astrometry and spectrophotometry for billions of stars, has brought three fundamental changes to our view of stellar streams in the Milky Way. First, more than a hundred stellar streams have been discovered and characterized using Gaia data. This is an order of magnitude increase in the number of known streams, thanks to Gaia's capacity for identifying comoving groups of stars among the field Milky Way population. Second, Gaia data have revealed that density variations both along and across stellar streams are common. Dark-matter subhalos, as well as baryonic structures were theoretically predicted to form such features, but observational evidence for density variations was uncertain before Gaia. Third, stream kinematics are now widely available and have constrained the streams' orbits and origins. Gaia has not only provided proper motions directly, but also enabl", "score": 0.457, "status": "included", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astronomy and Astrophysical Research"]}, {"key": "erkal2016number", "title": "The number and size of subhalo-induced gaps in stellar streams", "authors": ["Denis Erkal", "Vasily A Belokurov", "Jo Bovy", "Jason L. Sanders"], "n_authors": 4, "year": 2016, "venue": "Monthly Notices of the Royal Astronomical Society", "cited_by": 167, "doi": "10.1093/mnras/stw1957", "url": "https://doi.org/10.1093/mnras/stw1957", "oa_url": "https://arxiv.org/pdf/1606.04946", "abstract": "Ample observational capabilities exist today to detect the small density perturbations that low-mass dark matter subhaloes impart on stellar streams from disrupting Galactic satellites. In anticipation of these observations, we investigate the expected number and size of gaps by combining an analytic prescription for gap evolution on circular orbits with the flux of subhaloes near the stream. We explore the distribution of gap sizes and depths for a typical cold stream around the Milky Way and find that for a given stream age and gap depth, each subhalo mass produces a characteristic gap size. For a stream with an age of a few Gyr, orbiting at a distance of 10–20 kpc from the Galactic centre, even modest subhaloes with a mass of 106–107 M⊙ produce gaps with sizes that are of the order of several degrees. We consider the number and distribution of gap sizes created by subhaloes with masses 105–109 M⊙, accounting for the expected depletion of subhaloes by the Milky Way disc, and present predictions for six cold streams around the Milky Way. For Pal 5, we forecast 0.7 gaps with a density depletion of at least 25 per cent and a typical gap size of 8°. Thus, there appears to be no tensi", "score": 0.345, "status": "candidate", "preprint": false, "cluster": 1, "topics": ["Galaxies: Formation, Evolution, Phenomena", "Stellar, planetary, and galactic studies", "Dark Matter and Cosmic Phenomena"]}, {"key": "bonaca2018information", "title": "The Information Content in Cold Stellar Streams", "authors": ["Ana Bonaca", "David W. Hogg"], "n_authors": 2, "year": 2018, "venue": "The Astrophysical Journal", "cited_by": 97, "doi": "10.3847/1538-4357/aae4da", "url": "https://doi.org/10.3847/1538-4357/aae4da", "oa_url": "https://iopscience.iop.org/article/10.3847/1538-4357/aae4da/pdf", "abstract": "Abstract Cold stellar streams—produced by tidal disruptions of globular clusters—are long-lived, coherent dynamical features in the halo of the Milky Way. They hold the promise of delivering precise information about the gravitational potential, including constraints on the shape of the dark matter halo. Because of their different ages and different positions in phase space, different streams tell us different things about the Galaxy. Here we employ a Cramér–Rao lower bound (CRLB) or Fisher-matrix approach to understand the quantitative information content in (toy versions of) 11 known streams: ATLAS, GD-1, Hermus, Kwando, Orinoco, PS1A, PS1C, PS1D, PS1E, Sangarius, and Triangulum. This approach depends on a generative model, which we have developed previously, and which permits calculation of derivatives of predicted stream properties with respect to Galaxy and stream parameters. We find that in simple analytic models of the Milky Way, streams on eccentric orbits contain the most information about the halo shape. For each stream, there are near degeneracies between dark matter halo properties and parameters of the bulge, the disk, and the stream progenitor itself, but simultaneous", "score": 0.374, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astrophysical Phenomena and Observations"]}, {"key": "ibata2019streams", "title": "The Streams of the Gaping Abyss: A Population of Entangled Stellar Streams Surrounding the Inner Galaxy", "authors": ["Rodrigo Ibata", "Khyati Malhan", "Nicolas F. Martin"], "n_authors": 3, "year": 2019, "venue": "The Astrophysical Journal", "cited_by": 172, "doi": "10.3847/1538-4357/ab0080", "url": "https://doi.org/10.3847/1538-4357/ab0080", "oa_url": "https://iopscience.iop.org/article/10.3847/1538-4357/ab0080/pdf", "abstract": "Abstract We present the discovery of a large population of stellar streams that surround the inner Galaxy, found in the Gaia DR2 catalog using the new STREAMFINDER algorithm. Here we focus on the properties of eight new high-significance structures found at heliocentric distances between 1 and 10 kpc and at Galactic latitudes , named Slidr, Sylgr, Ylgr, Fimbulthul, Svöl, Fjörm, Gjöll, and Leiptr. Spectroscopic measurements of seven of the streams confirm the detections, which are based on Gaia astrometry and photometry alone, and show that these streams are predominantly metal-poor. The sample possesses diverse orbital properties, although most of the streams appear to be debris of inner-halo globular clusters. Many more candidate streams are visible in our maps but require follow-up spectroscopy to confirm their nature. We also explain in detail the workings of the algorithm and gauge the incidence of false detections by running the algorithm on a smooth model of the Gaia catalog.", "score": 0.477, "status": "included", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astronomy and Astrophysical Research"]}, {"key": "thomas2017stellar", "title": "Stellar streams as gravitational experiments", "authors": ["Guillaume F. Thomas", "Benoît Famaey", "Rodrigo Ibata", "Florent Renaud", "Nicolas F. Martin", "Pavel Kroupa"], "n_authors": 6, "year": 2017, "venue": "Astronomy and Astrophysics", "cited_by": 55, "doi": "10.1051/0004-6361/201731609", "url": "https://doi.org/10.1051/0004-6361/201731609", "oa_url": "https://www.aanda.org/articles/aa/pdf/2018/01/aa31609-17.pdf", "abstract": "Kinematically cold tidal streams of globular clusters (GC) are excellent tracers of the Galactic gravitational potential at moderate Galactocentric distances, and can also be used as probes of the law of gravity on Galactic scales. Here, we compare for the first time the generation of such streams in Newtonian and Milgromian gravity (MOND). We first computed analytical results to investigate the expected shape of the GC gravitational potential in both frameworks, and we then ran N-body simulations with the Phantom of Ramses code. We find that the GCs tend to become lopsided in MOND. This is a consequence of the external field effect which breaks the strong equivalence principle. When the GC is filling its tidal radius the lopsidedness generates a strongly asymmetric tidal stream. In Newtonian dynamics, such markedly asymmetric streams can in general only be the consequence of interactions with dark matter subhalos, giant molecular clouds, or interaction with the Galactic bar. In these Newtonian cases, the asymmetry is the consequence of a very large gap in the stream, whilst in MOND it is a true asymmetry. This should thus allow us in the future to distinguish these different scena", "score": 0.304, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Cosmology and Gravitation Theories"]}, {"key": "perottoni2019cold", "title": "A cold stellar stream in Pegasus", "authors": ["Hélio D. Perottoni", "Charles Martin", "Heidi Jo Newberg", "H. J. Rocha–Pinto", "F. Almeida-Fernandes", "A. R. Gomes-Júnior"], "n_authors": 6, "year": 2019, "venue": "Monthly Notices of the Royal Astronomical Society", "cited_by": 10, "doi": "10.1093/mnras/stz869", "url": "https://doi.org/10.1093/mnras/stz869", "oa_url": "https://doi.org/10.1093/mnras/stz869", "abstract": "We report the serendipitous discovery of a stellar stream in the constellation Pegasus in the south Galactic hemisphere. The stellar stream was detected using the SDSS Data Release 14 by means of a matched filter in the colour–magnitude diagram that is optimized for a stellar population that is 8 Gyr old with [Fe/H] = −0.46 dex, and located at heliocentric distance of 18 kpc. The candidate stream is faint (turn-off point at r0 ∼ 19.6), sparse and barely visible in SDSS photometry. It is also detected in the (shallower) Pan-STARRs data. The residual stellar density in the (u − g)0, (g − r)0 colour–colour diagram gives the same estimate for the age and [Fe/H] of this stellar population. The stream is located at a Galactic coordinates (l, b) = (79.4°, −24.6°) and extends over 9° (2.5 kpc), with a width of 112 pc. The narrow width suggests a globular cluster progenitor.", "score": 0.314, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astrophysics and Star Formation Studies"]}, {"key": "banik2018probing", "title": "Probing the nature of dark matter particles with stellar streams", "authors": ["Nilanjan Banik", "Gianfranco Bertone", "Jo Bovy", "Nassim Bozorgnia"], "n_authors": 4, "year": 2018, "venue": "Journal of Cosmology and Astroparticle Physics", "cited_by": 69, "doi": "10.1088/1475-7516/2018/07/061", "url": "https://doi.org/10.1088/1475-7516/2018/07/061", "oa_url": "https://iopscience.iop.org/article/10.1088/1475-7516/2018/07/061/pdf", "abstract": "A key prediction of the standard cosmological model—which relies on the assumption that dark matter is cold, i.e. non-relativistic at the epoch of structure formation—is the existence of a large number of dark matter substructures on sub-galactic scales. This assumption can be tested by studying the perturbations induced by dark matter substructures on cold stellar streams. Here, we study the prospects for discriminating cold from warm dark matter by generating mock data for upcoming astronomical surveys such as the Large Synoptic Survey Telescope (LSST), and reconstructing the properties of the dark matter particle from the perturbations induced on the stellar density profile of a stream. We discuss the statistical and systematic uncertainties, and show that the method should allow to set stringent constraints on the mass of thermal dark matter relics, and possibly to yield an actual measurement of the dark matter particle mass if it is in the (1) keV range.", "score": 0.398, "status": "candidate", "preprint": false, "cluster": 5, "topics": ["Dark Matter and Cosmic Phenomena", "Galaxies: Formation, Evolution, Phenomena", "Stellar, planetary, and galactic studies"]}, {"key": "mestre2019chaos", "title": "Effects of chaos on the detectability of stellar streams", "authors": ["Martín F. Mestre", "Claudio Llinares", "D. D. Carpintero"], "n_authors": 3, "year": 2019, "venue": "Monthly Notices of the Royal Astronomical Society", "cited_by": 15, "doi": "10.1093/mnras/stz3505", "url": "https://doi.org/10.1093/mnras/stz3505", "oa_url": "https://academic.oup.com/mnras/article-pdf/492/3/4398/32291305/stz3505.pdf", "abstract": "ABSTRACT Observations show that stellar streams originating in satellite dwarf galaxies are frequent in the Universe. While such events are predicted by theory, it is not clear how many of the streams that are generated are washed out afterwards to the point in which it is impossible to detect them. Here, we study how these diffusion times are affected by the fact that typical gravitational potentials of the host galaxies can sustain chaotic orbits. We do this by comparing the behaviour of simulated stellar streams that reside in chaotic or non-chaotic regions of the phase space. We find that chaos does reduce the time interval in which streams can be detected. By analysing detectability criteria in configuration and velocity space, we find that the impact of these results on the observations depends on the quality of both the data and the underlying stellar halo model. For all the stellar streams, we obtain a similar upper limit to the detectable mass.", "score": 0.321, "status": "candidate", "preprint": false, "cluster": 1, "topics": ["Galaxies: Formation, Evolution, Phenomena", "Stellar, planetary, and galactic studies", "Astrophysical Phenomena and Observations"]}, {"key": "bonaca2019multiple", "title": "Multiple Components of the Jhelum Stellar Stream", "authors": ["Ana Bonaca", "Charlie Conroy", "Adrian M. Price-Whelan", "David W. Hogg"], "n_authors": 4, "year": 2019, "venue": "The Astrophysical Journal Letters", "cited_by": 46, "doi": "10.3847/2041-8213/ab36ba", "url": "https://doi.org/10.3847/2041-8213/ab36ba", "oa_url": "https://iopscience.iop.org/article/10.3847/2041-8213/ab36ba/pdf", "abstract": "Abstract In simple models of the Milky Way, tidally disrupting satellites produce long and thin—nearly one-dimensional—stellar streams. Using astrometric data from the Gaia second data release and photometry from the Dark Energy Survey, we demonstrate that the Jhelum stream, a stellar stream in the inner halo, is a two-dimensional structure. The spatial distribution of highly probable Jhelum members reveals a dense thin component and an associated diffuse, spatially offset component. These two spatial components have indistinguishable proper motions (at σ ∼ 1 mas yr−1 level) and a similar ratio of blue straggler to blue horizontal branch stars, which indicates a common origin for the two components. The best-fit orbit to the narrow component (pericenter 8 kpc, apocenter 24 kpc), however, does not explain the wide component of the Jhelum stream. On the other hand, an older orbital wrap of Jhelum’s orbit traces the Indus stream, indicating a possible connection between these two structures and additional complexity in Jhelum’s formation. Substructure in the Jhelum progenitor or precession of its tidal debris in the Milky Way potential may explain the observed structure of Jhelum. Fut", "score": 0.352, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astrophysical Phenomena and Observations"]}, {"key": "newberg2021introduction", "title": "Introduction to Tidal Streams", "authors": ["Heidi Jo Newberg"], "n_authors": 1, "year": 2021, "venue": "In: Newberg H., Carlin J. (eds) Tidal Streams in the Local Group and Beyond. Astrophysics and Space Science Library, vol 420. Springer, Cham (2016)", "cited_by": 4, "doi": "10.1007/978-3-319-19336-6_1", "url": "https://doi.org/10.1007/978-3-319-19336-6_1", "oa_url": "https://arxiv.org/pdf/2103.04440", "abstract": "Dwarf galaxies that come too close to larger galaxies suffer tidal disruption; the differential gravitational force between one side of the galaxy and the other serves to rip the stars from the dwarf galaxy so that they instead orbit the larger galaxy. This process produces \"tidal streams\" of stars, which can be found in the stellar halo of the Milky Way, as well as in halos of other galaxies. This chapter provides a general introduction to tidal streams, including the mechanism through which the streams are created, the history of how they were discovered, and the observational techniques by which they can be detected. In addition, their use in unraveling galaxy formation history and the distribution of dark matter in galaxies is discussed, as is the interaction between these dwarf galaxy satellites and the disk of the larger galaxy.", "score": 0.231, "status": "candidate", "preprint": false, "cluster": 2, "topics": ["astro-ph.GA"]}, {"key": "grillmair2016stellar", "title": "Stellar Streams and Clouds in the Galactic Halo", "authors": ["Carl J. Grillmair", "Jeffrey L. Carlin"], "n_authors": 2, "year": 2016, "venue": "Astrophysics and Space Science Library, Volume 420. ISBN 978-3-319-19335-9. Springer International Publishing Switzerland, 2016, p. 87", "cited_by": 109, "doi": "10.1007/978-3-319-19336-6_4", "url": "https://doi.org/10.1007/978-3-319-19336-6_4", "oa_url": "https://arxiv.org/pdf/1603.08936", "abstract": "Recent years have seen the discovery of an ever growing number of stellar debris streams and clouds. These structures are typically detected as extended and often curvilinear overdensities of metal-poor stars that stand out from the foreground disk population. The streams typically stretch tens of degrees or more across the sky, even encircling the Galaxy, and range in heliocentric distance from 3 to 100 kpc. This chapter summarizes the techniques used for finding such streams and provides tables giving positions, distances, velocities, and metallicities, where available, for all major streams and clouds that have been detected as of January 2015. Sky maps of the streams are also provided. Properties of individual tidal debris structures are discussed.", "score": 0.362, "status": "candidate", "preprint": false, "cluster": 2, "topics": ["astro-ph.GA"]}, {"key": "chang2026reconciling", "title": "Reconciling Galactic rotation curve constraints with stellar stream modeling", "authors": ["M nal galaxies. This chapter details the current state of our observational knowledge of streams in galaxies in and beyond the Local Group, which are studied both in resolved stellar populations and in integrated light. Modeling of individual streams in extragalactic systems is hampered by our inability to obtain resolved stellar kinematics in the streams, though many streams contain alternate luminous kinematic tracers, such as globular clusters or planetary nebulae. We compare the observed structures to the predictions of models of galactic halo formation, which provide insight in the number and properties of streams expected around Milky Way like galaxies. More specifically, we discuss the inferences that can be made about stream progenitors based only on observed morphologies. We expand our discussion to consider hierarchical accretion at lower mass scales, in particular the observational evidence that substructure exists on smaller mass scales and the effects ac", "score": 0.3, "status": "candidate", "preprint": false, "cluster": 2, "topics": ["astro-ph.GA"]}, {"key": "banik2019constraints", "title": "Novel constraints on the particle nature of dark matter from stellar streams", "authors": ["Nilanjan Banik", "Jo Bovy", "Gianfranco Bertone", "Denis Erkal", "T. J. L. de Boer"], "n_authors": 5, "year": 2019, "venue": "arXiv", "cited_by": 122, "doi": "10.1088/1475-7516/2021/10/043", "url": "https://doi.org/10.1088/1475-7516/2021/10/043", "oa_url": "https://arxiv.org/pdf/1911.02663", "abstract": "Tidal streams are highly sensitive to perturbations from passing dark matter (DM) subhalos and thus provide a means of measuring their abundance. In a recent paper, we analyzed the distribution of stars along the GD-1 stream with a combination of data from the Gaia satellite and the Pan-STARRS survey, and we demonstrated that the population of DM subhalos predicted by the cold dark matter (CDM) paradigm are necessary and sufficient to explain the perturbations observed in the  1, "year": 2019, "venue": "", "cited_by": 0, "doi": "", "url": "https://fse.studenttheses.ub.rug.nl/20160/", "oa_url": "", "abstract": "The second Gaia data release (Gaia Collaboration et al., 2018a) has provided evidence for a merger event roughly 10 Gyr ago with an object named Gaia-Enceladus (Helmi et al., 2018). A previous simulation by Villalobos and Helmi (2008, 2009) produced a similar velocity distribution of halo stars near the Sun as seen in the Gaia data. In this bachelor thesis I continue this simulation for 10 Gyr in an attempt to characterize stars of Gaia-Enceladus, which accounts for a large fraction of the galactic halo and possibly triggered the formation of the thick disk. The aim of the thesis is to help interpret the observations and to provide means to find likely members of Gaia-Enceladus in the Gaia data, especially at large distances from the Sun. I find that the characteristic kinematics of the accreted stars are maintained through the extension of the simulation and still show similarities to the various features seen in the Gaia data. These features can be understood well when analyzing the angular momentum and eccentricity as they are correlated to the initial position of the stars, and to the mass loss history.", "score": 0.286, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astrophysics and Star Formation Studies"]}, {"key": "grand2020dual", "title": "The dual origin of the Galactic thick disc and halo from the gas-rich Gaia–Enceladus Sausage merger", "authors": ["Robert J. J. Grand", "Daisuke Kawata", "Vasily A Belokurov", "Alis J. Deason", "Azadeh Fattahi", "Francesca Fragkoudi"], "n_authors": 9, "year": 2020, "venue": "Monthly Notices of the Royal Astronomical Society", "cited_by": 126, "doi": "10.1093/mnras/staa2057", "url": "https://doi.org/10.1093/mnras/staa2057", "oa_url": "https://academic.oup.com/mnras/article-pdf/497/2/1603/33559073/staa2057.pdf", "abstract": "ABSTRACT We analyse a set of cosmological magnetohydrodynamic simulations of the formation of Milky Way-mass galaxies identified to have a prominent radially anisotropic stellar halo component similar to the so-called ‘Gaia Sausage’ found in the Gaia data. We examine the effects of the progenitor of the Sausage (the Gaia–Enceladus Sausage, GES) on the formation of major galactic components analogous to the Galactic thick disc and inner stellar halo. We find that the GES merger is likely to have been gas-rich and contribute 10–50 ${{\\ \\rm per\\ cent}}$ of gas to a merger-induced centrally concentrated starburst that results in the rapid formation of a compact, rotationally supported thick disc that occupies the typical chemical thick disc region of chemical abundance space. We find evidence that gas-rich mergers heated the proto-disc of the Galaxy, scattering stars on to less-circular orbits such that their rotation velocity and metallicity positively correlate, thus contributing an additional component that connects the Galactic thick disc to the inner stellar halo. We demonstrate that the level of kinematic heating of the proto-galaxy correlates with the kinematic state of the popu", "score": 0.491, "status": "included", "preprint": false, "cluster": 1, "topics": ["Galaxies: Formation, Evolution, Phenomena", "Stellar, planetary, and galactic studies", "Astrophysics and Star Formation Studies"]}, {"key": "han2021lamosts", "title": "LAMOST’s view on the Gaia-Sausage-Enceladus merger event", "authors": ["Zhanwen Han"], "n_authors": 1, "year": 2021, "venue": "Science China Physics Mechanics and Astronomy", "cited_by": 2, "doi": "10.1007/s11433-020-1648-1", "url": "https://doi.org/10.1007/s11433-020-1648-1", "oa_url": "https://link.springer.com/content/pdf/10.1007/s11433-020-1648-1.pdf", "abstract": "", "score": 0.201, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astrophysics and Star Formation Studies"]}, {"key": "merrow2024did", "title": "Did the Gaia Enceladus/Sausage merger form the Milky Way’s bar?", "authors": ["Alex Merrow", "Robert J. J. Grand", "Francesca Fragkoudi", "Marie Martig"], "n_authors": 4, "year": 2024, "venue": "Monthly Notices of the Royal Astronomical Society", "cited_by": 25, "doi": "10.1093/mnras/stae1250", "url": "https://doi.org/10.1093/mnras/stae1250", "oa_url": "https://academic.oup.com/mnras/advance-article-pdf/doi/10.1093/mnras/stae1250/57572918/stae1250.pdf", "abstract": "ABSTRACT The Milky Way’s last significant merger, the Gaia Enceladus/Sausage (GES), is thought to have taken place between $8\\hbox{ and }11\\, \\mathrm{Gyr}$ ago. Recent studies in the literature suggest that the bar of the Milky Way is rather old, indicating that it formed at a similar epoch to the GES merger. We investigate the possible link between these events using one of the Auriga cosmological simulations that has salient features in common with the Milky Way, including a last significant merger with kinematic signatures resembling that of the GES. In this simulation, the GES-like merger event triggers tidal forces on the disc, gas inflows, and a burst of star formation, with the formation of a bar occurring within $1\\, \\mathrm{Gyr}$ of the first pericentre. To highlight the effects of the merger, we rerun the simulation from z = 4 with the progenitors of the GES-like galaxy removed well before the merger time. The consequence is a delay in bar formation by around $2\\, \\mathrm{Gyr}$, and this new bar forms without any significant external perturbers. We conclude that this Milky Way-like simulation shows a route to the real Milky Way’s bar forming around the epoch of the GES me", "score": 0.41, "status": "included", "preprint": false, "cluster": 1, "topics": ["Galaxies: Formation, Evolution, Phenomena", "Stellar, planetary, and galactic studies", "Astrophysical Phenomena and Observations"]}, {"key": "ciuca2023chasing", "title": "Chasing the impact of the Gaia-Sausage-Enceladus merger on the formation of the Milky Way thick disc", "authors": ["Ioana Ciucă", "Daisuke Kawata", "Yuan-Sen Ting", "Robert J. J. Grand", "Andrea Miglio", "Michael Hayden"], "n_authors": 11, "year": 2023, "venue": "Monthly Notices of the Royal Astronomical Society Letters", "cited_by": 54, "doi": "10.1093/mnrasl/slad033", "url": "https://doi.org/10.1093/mnrasl/slad033", "oa_url": "https://academic.oup.com/mnrasl/advance-article-pdf/doi/10.1093/mnrasl/slad033/49512754/slad033.pdf", "abstract": "ABSTRACT We employ our Bayesian Machine Learning framework BINGO (Bayesian INference for Galactic archaeOlogy) to obtain high-quality stellar age estimates for 68 360 red giant and red clump stars present in the 17th data release of the Sloan Digital Sky Survey, the APOGEE-2 high-resolution spectroscopic survey. By examining the denoised age-metallicity relationship of the Galactic disc stars, we identify a drop in metallicity with an increase in [Mg/Fe] at an early epoch, followed by a chemical enrichment episode with increasing [Fe/H] and decreasing [Mg/Fe]. This result is congruent with the chemical evolution induced by an early-epoch gas-rich merger identified in the Milky Way-like zoom-in cosmological simulation Auriga. In the initial phase of the merger of Auriga 18 there is a drop in metallicity due to the merger diluting the metal content and an increase in the [Mg/Fe] of the primary galaxy. Our findings suggest that the last massive merger of our Galaxy, the Gaia-Sausage-Enceladus, was likely a significant gas-rich merger and induced a starburst, contributing to the chemical enrichment and building of the metal-rich part of the thick disc at an early epoch.", "score": 0.477, "status": "included", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astrophysics and Star Format alaxy, was likely a gas-rich merger and the large amount of gas introduced could have created a profound impact on the Galactic morphology. This study utilizes GIZMO simulation code to construct a gas-rich GSE merger. By reconstructing the observed characteristics of the GSE, we successfully reproduce the disk warp and capture nearly all of its documented features, which align closely with observational data from both stellar and gas disks. This simulation demonstrates the possibility that a single major merger could generate the Galactic warp amplitude and precession. Furthermore, the analysis of the warp’s long-term evolution may offer more clues into the formation history of the Milky Way.", "score": 0.46, "status": "included", "preprint": false, "cluster": 1, "topics": ["Galaxies: Formation, Evolution, Phenomena", "Stellar, planetary, and galactic studies", "Astrophysical Phenomena and Observations"]}, {"key": "massari2026evidence", "title": "Evidence of a massive accretion event 1.8 billion years before the Gaia-Sausage-Enceladus merger", "authors": ["D. Massari", "Chiara Zerbinati", "C. Fanelli", "A. Helmi", "E. Ceccarelli", "Fernando Aguado Agelet"], "n_authors": 18, "year": 2026, "venue": "Nature Astronomy", "cited_by": 3, "doi": "10.1038/s41550-026-02931-5", "url": "https://doi.org/10.1038/s41550-026-02931-5", "oa_url": "https://www.nature.com/articles/s41550-026-02931-5.pdf", "abstract": "Abstract The merger history of the Galaxy has been traced back firmly to a redshift of 2 (10 billion years ago). While evidence for the existence of at least one more substantial merger before this time has been presented, its interpretation is yet to be fully established. Here we show that the population of globular clusters around the Galaxy depicts three distinct age–metallicity sequences, one associated with the progenitor of the Milky Way, one with the merger with Gaia-Sausage-Enceladus 10 billion years ago and a third intermediate sequence associated with at least one merger that we estimate took place about 1.8 billion years before Gaia-Sausage-Enceladus. This discovery has been possible thanks to exquisite Hubble Space Telescope data and sophisticated analysis that enables very precise relative age determination of globular clusters. The newly identified sequence reveals that this merger took place with an object of a similar stellar mass to that of Gaia-Sausage-Enceladus (≃5 × 10 8 stellar masses, M ⊙ ) that deposited most of its mass in the inner 6 kpc of the Milky Way. The identification of a third merger event in the inner Galaxy puts to rest earlier debates and, honour", "score": 0.422, "status": "included", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astrophysics and Star Formation Studies"]}, {"key": "matsuno2021process", "title": "$R$-process enhancements of Gaia-Enceladus in GALAH DR3", "authors": ["Tadafumi Matsuno", "Yutaka Hirai", "Yuta Tarumi", "Kenta Hotokezaka", "Masaomi Tanaka", "Amina Helmi"], "n_authors": 6, "year": 2021, "venue": "A&A 650, A110 (2021)", "cited_by": 78, "doi": "10.1051/0004-6361/202040227", "url": "https://doi.org/10.1051/0004-6361/202040227", "oa_url": "https://arxiv.org/pdf/2101.07791", "abstract": "Context. The dominant site of production of r -process elements remains unclear despite recent observations of a neutron star merger. Observational constraints on the properties of the sites can be obtained by comparing r -process abundances in different environments. The recent Gaia data releases and large samples from high-resolution optical spectroscopic surveys are enabling us to compare r -process element abundances between stars formed in an accreted dwarf galaxy, Gaia-Enceladus, and those formed in the Milky Way. Aims. Our aim is to understand the origin of r -process elements in Gaia-Enceladus. Methods. We first constructed a sample of stars so that our study on Eu abundance is not affected by the {"key": "skuladottir2025evidence", "title": "Evidence of Gaia Enceladus experiencing at least two passages around the Milky Way", "authors": ["Ása Skúladóttir", "Heitor Ernandes", "Diane K. Feuillet", "Alice Mori", "Sofia Feltzing", "Romain E. R. Lucchesi"], "n_authors": 7, "year": 2025, "venue": "arXiv", "cited_by": 10, "doi": "10.3847/2041-8213/addc66", "url": "https://doi.org/10.3847/2041-8213/addc66", "oa_url": "https://arxiv.org/pdf/2506.00409", "abstract": "Abstract One of the major recent breakthroughs has been the discovery of the last major merger to happen in the history of the Milky Way. Around 10 Gyr ago, the galaxy Gaia Enceladus with an estimated ∼10% of the Milky Way mass, fell into the potential of our Galaxy, bringing a large amount of stars that can be identified through their unique chemical and kinematic signatures. Simulations have long predicted that a galaxy of this size should experience several passages through the disk of the Milky Way before eventually being fully dispersed. For the first time, we present observational evidence to support this. We identify two subpopulations accreted from Gaia Enceladus: (1) stars that today have large kinematic energy, which originated from the outskirts of Gaia Enceladus and were accreted during early passages; (2) stars with low kinetic energy accreted at later passages, originating from the inner parts of Gaia Enceladus. Through the use of high-precision chemical abundances, crucially including new aluminum measurements, we show that in all observed abundance ratios ([Fe/H], [Al/Fe], [Mg/Fe], and [Mg/Ba]), stars with high energy show evidence of coming from a less chemically e", "score": 0.28, "status": "candidate", "preprint": false, "cluster": 2, "topics": ["astro-ph.GA", "astro-ph.SR"]}, {"key": "ernandes2024gaia", "title": "Gaia-Sausage-Enceladus star formation history as revealed by detailed elemental abundances", "authors": ["H. Ernandes", "D. Feuillet", "S. Feltzing", "Á. Skúladóttir"], "n_autho ions"]}, {"key": "robertson2006mergerdriven", "title": "A Merger‐driven Scenario for Cosmological Disk Galaxy Formation", "authors": ["Brant E. Robertson", "James S. Bullock", "Thomas J. Cox", "Tiziana Di Matteo", "Lars Hernquist", "Volker Springel"], "n_authors": 7, "year": 2006, "venue": "The Astrophysical Journal", "cited_by": 531, "doi": "10.1086/504412", "url": "https://doi.org/10.1086/504412", "oa_url": "https://iopscience.iop.org/article/10.1086/504412/pdf", "abstract": "The hierarchical nature of the ΛCDM cosmology poses serious difficulties for the formation of disk galaxies. To help resolve these issues, we describe a new, merger-driven scenario for the cosmological formation of disk galaxies at high redshifts that supplements the standard dissipational collapse model. In this picture, large gaseous disks may be produced from high angular momentum mergers of systems that are gas dominated, i.e., M gas /( M gas + M ⋆ ) ≳ 0.5 at the height of the merger. Pressurization from the multiphase ISM prevents the complete conversion of gas into stars during the merger, and if enough gas remains to form a disk, the remnant eventually resembles a disk galaxy. We perform numerical simulations of galaxy mergers to study how supernovae feedback strength, black hole feedback, progenitor gas fraction, merger mass ratio, and orbital geometry impact the formation of remnant disks. We find that disks can build angular momentum through mergers and the degree of rotational support of the baryons in the remnant is primarily related to feedback processes associated with star formation. Disk-dominated remnants are restricted to form in mergers that are gas dominated at ", "score": 0.4, "status": "candidate", "preprint": false, "cluster": 1, "topics": ["Galaxies: Formation, Evolution, Phenomena", "Astrophysics and Star Formation Studies", "Stellar, planetary, and galactic studies"]}, {"key": "brook2004emergence", "title": "The Emergence of the Thick Disk in a Cold Dark Matter Unive ly of the Milky Way", "authors": ["Josefina Montalbán", "J. Ted Mackereth", "Andrea Miglio", "Fiorenzo Vincenzo", "Cristina Chiappini", "G. Buldgen"], "n_authors": 19, "year": 2021, "venue": "Nature Astronomy", "cited_by": 134, "doi": "10.1038/s41550-021-01347-7", "url": "https://doi.org/10.1038/s41550-021-01347-7", "oa_url": "https://arxiv.org/pdf/2006.01783", "abstract": "", "score": 0.23, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astronomy and Astrophysical Research"]}, {"key": "queiroz2021milky", "title": "The Milky Way bar and bulge revealed by APOGEE and Gaia EDR3", "authors": ["A. B. A. Queiroz", "C. Chiappini", "Ángeles Pérez-Villegas", "A. Khalatyan", "Friedrich Anders", "B. Barbuy"], "n_authors": 26, "year": 2021, "venue": "Astronomy and Astrophysics", "cited_by": 118, "doi": "10.1051/0004-6361/202039030", "url": "https://doi.org/10.1051/0004-6361/202039030", "oa_url": "https://www.aanda.org/articles/aa/pdf/2021/12/aa39030-20.pdf", "abstract": "We investigate the inner regions of the Milky Way using data from APOGEE and Gaia EDR3. Our inner Galactic sample has more than 26 500 stars within |XGal|< 5 kpc, |YGal|< 3.5 kpc, |ZGal|< 1 kpc, and we also carry out the analysis for a foreground-cleaned subsample of 8000 stars that is more representative of the bulge–bar populations. These samples allow us to build chemo-dynamical maps of the stellar populations with vastly improved detail. The inner Galaxy shows an apparent chemical bimodality in key abundance ratios [α/Fe], [C/N], and [Mn/O], which probe different enrichment timescales, suggesting a star formation gap (quenching) between the high- and low-α populations. Using a joint analysis of the distributions of kinematics, metallicities, mean orbital radius, and chemical abundances, we can characterize the different populations coexisting in the innermost regions of the Galaxy for the first time ion to the payload module, the performance of which is closely related to the scientific performance of the mission. We provide a summary of the commissioning", "score": 0.415, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Astronomy and Astrophysical Research", "Astronomical Observations and Instrumentation"]}, {"key": "hu2000fuzzy", "title": "Fuzzy Cold Dark Matter: The Wave Properties of Ultralight Particles", "authors": ["Wayne Hu", "Rennan Barkana", "Andrei V. Gruzinov"], "n_authors": 3, "year": 2000, "venue": "Physical Review Letters", "cited_by": 1809, "doi": "10.1103/physrevlett.85.1158", "url": "https://doi.org/10.1103/physrevlett.85.1158", "oa_url": "https://arxiv.org/pdf/astro-ph/0003365", "abstract": "Cold dark matter (CDM) models predict small-scale structure in excess of observations of the cores and abundance of dwarf galaxies. These problems might be solved, and the virtues of CDM models retained, even without postulating ad hoc dark matter particle or field interactions, if the dark matter is composed of ultralight scalar particles (m approximately 10(-22) eV), initially in a (cold) Bose-Einstein condensate, similar to axion dark matter models. The wave properties of the dark matter stabilize gravitational collapse, providing halo cores and sharply suppressing small-scale linear power.", "score": 0.227, "status": "candidate", "preprint": false, "cluster": 5, "topics": ["Dark Matter and Cosmic Phenomena", "Cosmology and Gravitation Theories", "Galaxies: Formation, Evolution, Phenomena"]}, {"key": "ibata1994dwarf", "title": "A dwarf satellite galaxy in Sagittarius", "authors": ["Rodrigo Ibata", "Gerard F. Gilmore", "Michael J. Irwin"], "n_authors": 3, "year": 1994, "venue": "Nature", "cited_by": 1381, "doi": "10.1038/370194a0", "url": "https://doi.org/10.1038/370194a0", "oa_url": "", "abstract": "", "score": 0.27, "status": "candidate", "preprint": false, "cluster": 1, "topics": ["Galaxi our velocity un", "score": 0.351, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astronomy and Astrophysical Research"]}, {"key": "perryman1997hipparcos", "title": "The Hipparcos Catalogue", "authors": ["M. A. C. Perryman", "L. Lindegren", "J. Kovalevsky", "Erik Høg", "U. Bastian", "P. L. Bernacca"], "n_authors": 20, "year": 1997, "venue": "HAL", "cited_by": 398, "doi": "", "url": "https://hal.science/hal-02053811", "oa_url": "https://hal.science/hal-02053811", "abstract": "The principal observational characteristics of the Hipparcos Catalogue, and a summary of its main astrometric and photometric properties, are presented. Median astrometric standard errors (in position, parallax, and annual proper motion) are in the range 0.7-0.9 milliarcsec (mas) for stars brighter than 9 mag at the catalogue epoch (J1991.25). The catalogue is a materialisation of the ICRS reference system, coinciding with its principal axes at the level of +/-0.6 mas, and with proper motions consistent with an inertial system at the level of +/-0.25 mas/yr. The 118218 constituent stars provide a mean sky density of similar to 3 stars deg(-2). The catalogue is available in printed and machine-readable forms.", "score": 0.167, "status": "candidate", "preprint": true, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Astronomy and Astrophysical Research", "History and Developments in Astronomy"]}, {"key": "hunt2025milky", "title": "Milky Way dynamics in light of Gaia", "authors": ["John Douglas Hunt", "Eugene Vasiliev"], "n_authors": 2, "year": 2025, "venue": "New Astronomy Reviews", "cited_by": 66, "doi": "10.1016/j.newar.2024.101721", "url": "https://doi.org/10.1016/j.newar.2024.101721", "oa_url": "https://doi.org/10.1016/j.newar.2024.101721", "abstract": "The Gaia mission has triggered major developments in the field of Galactic dynamics in recent years, which we discuss in this review. The structure and kinematics of all Galactic components - disc, bar/bulge and halo - are now mapped in great detail not only in the Solar neighbourhood, but across a large part of the Milky Way. The dramatic improvements in the coverage and precision of observations revealed various disequilibrium processes, such as perturbations in the Galactic disc and the deformations of the outer halo, which are partly attributed to the interaction with satellite galaxies. The knowledge of the gravitational potential at all scales has also advanced considerably, but we are still far from having a consistent view on the key properties of the Galaxy, such as the bar pattern speed or the mass profile and shape of the dark halo. The complexity and interplay of several dynamical processes makes the interpretation of observational data challenging, and it is fair to say that more theoretical effort is needed to fully reap the fruit of the Gaia revolution.", "score": 0.336, "status": "candidate", "preprint": false, "cluster": 0, "topics": ["Stellar, planetary, and galactic studies", "Galaxies: Formation, Evolution, Phenomena", "Astrophysical Phenomena and Observations"]}, {"key": "nadler2025cozmic", "title": "COZMIC. I. Cosmological Zoom-in Simulations with Initial Conditions Beyond Cold Dark Matter", "authors": ["Ethan O. Nadler", "Rui An", "Vera Gluscevic", "Andrew Benson", "Xiaolong Du"], "n_authors": 5, "year": 2025, "venue": "The Astrophysical Journal", "cited_by": 25, "doi": "10.3847/1538-4357/adceef", "url": "https://doi.org/10.3847/1538-4357/adceef", "oa_url": "https://iopscience.iop.org/article/10.3847/1538-4357/adceef/pdf", "abstract": "Abstract We present 72 cosmological dark-matter--only N -body zoom-in simulations with initial conditions beyond cold, collisionless dark matter (CDM), as the first installment of the COZMIC suite. We simulate Milky Way (MW) analogs with linear matter power spectra P ( k ) for (i) thermal-relic warm dark matter (WDM) with masses m WDM ∈ [3, 4, 5, 6, 6.5, 10]keV, (ii) fuzzy dark matter (FDM) with masses m FDM ∈ [25.9,69.4, 113, 151, 185, 490] × 10 −22 eV, and (iii) interacting dark matter (IDM) with a velocity-dependent elastic proton scattering cross section σ = σ 0 v n , relative particle velocity scaling n ∈ [2, 4], and dark matter mass m IDM ∈ [10 −4 , 10 −2 , 1] GeV. Subhalo mass function (SHMF) suppression is significantly steeper in FDM versus WDM, while dark acoustic oscillations in P ( k ) can reduce SHMF suppression for IDM. We fit SHMF models to our simulation results and derive new bounds on WDM and FDM from the MW satellite population, obtaining m WDM > 5.9 keV and m FDM > 1.4 × 10 −20 eV at 95% confidence; these limits are ≈10% weaker and 5× stronger than previous constraints owing to the updated transfer functions and SHMF models, respectively. We estimate IDM bounds ", "score": 0.269, "status": "candidate", "preprint": false, "cluster": 5, "topics": ["Dark Matter and Cosmic Phenomena", "Galaxies: Formation, Evolution, Phenomena", "Cosmology and Gravitation Theories"]}, {"key": "chen2025improved", "title": "Improved Particle Spray Algorithm for Modeling Globular Cluster Streams", "authors": ["Yingtian Chen", "Monica Valluri", "Oleg Y. Gnedin", "Neil F. Ash"], "n_authors": 4, "year": 2025, "venue": "The Astrophysical Journal Supplement Series", "cited_by": 21, "doi": "10.3847/1538-4365/ad9904", "url": "https://doi.org/10.3847/1538-4365/ad9904", "oa_url": "https://doi.org/10.3847/1538-4365/ad9904", "abstract": "Abstract Stellar streams that emerge from globular clusters (GCs) are thin stellar structures spread along the orbits of progenitor clusters. Numerical modeling of these streams is essential for understanding their interaction with the host galaxy's mass distribution. Traditional methods are either computationally expensive or oversimplified, motivating us to develop a fast and accurate approach using a particle spray algorithm. By conducting a series of N -body simulations of GCs orbiting a host galaxy, we find that the position and velocity distributions of newly escaped stream particles are consistent across various GC masses and orbital parameters. Based on these distributions, we develop a new algorithm that avoids computing the detailed internal cluster dynamics by directly drawing tracer particles from these distributions. This algorithm correctly reproduces the action space distribution of stream particles and achieves a 10% accuracy in stream morphology and velocities compared to N -body simulations. To facilitate broader use, we have implemented this algorithm in galactic dynamics codes agama , gala , galax , and galpy .", "score": 0.302, "status": "candidate", "preprint": false, "cluster": 1, "topics": ["Galaxies: Formation, Evolution, Phenomena", "Stellar, planetary, and galactic studies", "Astrophysical Phenomena and Observations"]}, {"key": "nibauer2025galactic", "title": "Galactic Accelerations from the GD-1 Stream Suggest a Tilted Dark Matter Halo", "authors": ["Jacob Nibauer", "Ana Bonaca"], "n_authors": 2, "year": 2025, "venue": "The Astrophysical Journal Letters", "cited_by": 17, "doi": "10.3847/2041-8213/add0a9", "url": "https://doi.org/10.3847/2041-8213/add0a9", "oa_url": "https://iopscience.iop.org/article/10.3847/2041-8213/add0a9/pdf", "abstract": "Abstract Cold dark matter halos are expected to be triaxial and often tilted relative to the stellar disk. Stellar streams provide a sensitive tracer of the Milky Way’s halo shape though models for the Galactic potential are typically limited to simple, symmetric functional forms. Here, we measure the Galactic acceleration field along the GD-1 stream using a direct differentiation of the stream’s track in phase space. Using a fully data-driven catalog of stream members from Gaia, Sloan Digital Sky Survey, LAMOST, and DESI, we map the stream in 6D phase space. We fit splines to the stream track and infer cylindrical acceleration components a R = − 2.5 ± 0.1 0.2 function plist(arr){
  if (!arr.length) return `<p class="hint">None in this set.</p>`;
  return `<ul class="plist">${arr.sort((a, b) => (b.year||0) - (a.year||0)).map(p => `<li data-k="${esc(p.key)}"><span class="y">${p.year || "—"}</span><span class="t">${esc(p.title)}</span></li>`).join("")}</ul>`;
}
function select(n){
  sel = n; highlight(n); draw();
  const side = $("#side");
  if (!n){ side.innerHTML = overview(); bind(); return; }
  const cl = DATA.clusters.find(c => c.id === n.cluster);
  const authors = n.authors.join(", ") + (n.n_authors > n.authors.length ? ` + ${n.n_authors - n.authors.length} more` : "");
  side.innerHTML = `
    <h2>Paper</h2>
    <div class="ptitle">${esc(n.title)}</div>
    <div class="authors">${esc(authors)}</div>
    <div class="authors"><i>${esc(n.venue || "Venue unknown")}</i>${n.year ? " · " + n.year : ""}</div>
    <div class="chips">
      <span class="chip">${n.cited_by} citations</span>
      <span class="chip">relevance ${(n.score * 100).toFixed(0)}</span>
      ${cl ? `<span class="chip"><span class="sw" style="display:inline-block;width:8px;height:8px;background:${color(n.cluster)};margin-right:5px"></span>${esc(cl.name)}</span>` : ""}
      ${n.preprint ? `<span class="chip warn">⚠ preprint · not peer-reviewed</span>` : ""}
      <span class="chip" style="font-family:var(--mono)">@${esc(n.key)}</span>
    </div>
    <div class="links">${n.doi ? `<a href="https://doi.org/${esc(n.doi)}" target="_blank" rel="noopener">DOI ↗</a>` : (n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">Record ↗</a>` : "")}${n.oa_url ? `<a href="${esc(n.oa_url)}" target="_blank" rel="noopener">Free full text ↗</a>` : ""}</div>
    ${n.abstract ? `<div class="abs">${esc(n.abstract)}${n.abstract.length >= 1200 ? "…" : ""}</div>` : `<p class="hint">No abstract available from the APIs.</p>`}
    <h2>Cites (in this set) · ${out[n.key].length}</h2>${plist([...out[n.key]])}
    <h2>Cited by (in this set) · ${inc[n.key].length}</h2>${plist([...inc[n.key]])}
    <p class="hint" style="margin-top:18px"><a href="#" id="back" style="color:var(--accent)">← Back to overview</a></p>`;
  bind();
}
function overview(){
  const top = [...nodes].sort((a, b) => b.score - a.score).slice(0, 12);
  const unl = nodes.filter(n => n.cluster < 0).length;
  return `
    <h2>Clusters</h2>
    <div class="legend">${DATA.clusters.map(c => `<button data-c="${c.id}" aria-pressed="${!hidden.has(c.id)}"><span class="sw" style="background:${color(c.id)}"></span>${esc(c.name)}<span class="n">${c.size}</span></button>`).join("")}
    ${unl ? `<button data-c="-1" aria-pressed="${!hidden.has(-1)}"><span class="sw" style="background:var(--cx)"></span>Not linked to others<span class="n">${unl}</span></button>` : ""}</div>
    <p class="hint">Clusters are groups of papers that cite each other. Click a cluster to hide or show it.</p>
    <h2>Start reading here</h2>${plist(top)}
    <h2>How to read this map</h2>
    <p class="hint">Each dot is a paper; an arrow points from a paper to one it cites. Bigger dots have more citations (or higher relevance — toggle above). Dashed outlines are preprints. Faded dots are candidates that did not make the reading list. <b>Timeline</b> spreads papers by year so you can see which ideas came first.</p>
    ${DATA.query ? `<h2>Research question</h2><p class="abs" style="margin-top:0">${esc(DATA.query)}</p>` : ""}`;
}
function bind(){
  document.querySelectorAll("#side li[data-k]").forEach(li => li.onclick = () => select(byKey[li.dataset.k]));
  document.querySelectorAll("#side .legend button").forEach(b => b.onclick = () => {
    const c = +b.dataset.c; hidden.has(c) ? hidden.delete(c) : hidden.add(c); b.setAttribute("aria-pressed", !hidden.has(c)); draw(); });
  const back = $("#back"); if (back) back.onclick = e => { e.preventDefault(); select(null); };
}
$("#q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  nodes.forEach((n, i) => {
    const hit = query && (n.title + " " + n.authors.join(" ") + " " + n.venue + " " + n.key).toLowerCase().includes(query);
    nEls[i].classList.toggle("match", !!hit); nEls[i].classList.toggle("dim", !!query && !hit);
    lEls[i].style.display = hit ? "" : (labelled.has(n.key) && !query ? "" : "none");
  });
});
const setMode = m => { mode = m; $("#vNet").setAttribute("aria-pressed", m === "net"); $("#vTime").setAttribute("aria-pressed", m === "time"); gA.innerHTML = ""; run(260); };
$("#vNet").onclick = () => setMode("net"); $("#vTime").onclick = () => setMode("time");
const setSize = s => { sizeBy = s; $("#sCite").setAttribute("aria-pressed", s === "cite"); $("#sScore").setAttribute("aria-pressed", s === "score"); draw(); };
$("#sCite").onclick = () => setSize("cite"); $("#sScore").onclick = () => setSize("score");
$("#fit").onclick = fit;
$("#theme").onclick = () => { const r = document.documentElement; const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = r.dataset.theme || (dark ? "dark" : "light"); r.dataset.theme = cur === "dark" ? "light" : "dark"; };
window.addEventListener("resize", () => { W = stage.clientWidth; H = stage.clientHeight; fit(); });
apply(); select(null); run();
})();
</script>
</body>
</html>
